<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;padding:18px 20px;min-height:100vh;display:flex;flex-direction:column}#time{margin-top:auto;padding-top:16px;padding-right:var(--kadr-controls-width);font-size:10px}small,.label{font-size:10px;letter-spacing:1px;color:var(--kadr-muted)}h1{font-size:32px;letter-spacing:-1px;margin:12px 0 8px;line-height:1.1}p{font-size:12px;line-height:1.6;margin:0;color:var(--kadr-muted)}b{color:var(--kadr-fg)}.row{display:flex;align-items:center;justify-content:space-between}.badge{background:var(--kadr-accent);color:#344825;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:20px}.bars{display:flex;gap:4px;margin:18px 0 7px}.bars i{height:18px;flex:1;border-radius:3px}.axis{display:flex;justify-content:space-between;font-size:8px;color:var(--kadr-muted)}</style></head>
<body><div class="label">KYIV · OPEN-METEO</div>
<div class="row"><h1 id="temperature">Loading…</h1><span style="font-size:42px;color:var(--kadr-accent)">☀</span></div>
<p id="details"></p><p id="time"></p>
<script>
async function update() {
  const url = 'https://api.open-meteo.com/v1/forecast?latitude=50.45&longitude=30.52&current=temperature_2m,apparent_temperature,wind_speed_10m&timezone=Europe%2FKyiv';
  const response = await fetch(url);
  if (!response.ok) throw Error('API: HTTP '+response.status);
  const {current:d} = await response.json();
  document.querySelector('#temperature').textContent = (d.temperature_2m>0?'+':'')+d.temperature_2m+'°';
  document.querySelector('#details').textContent = 'Feels like '+d.apparent_temperature+'° · wind '+d.wind_speed_10m+' km/h';
  document.querySelector('#time').textContent = 'Forecast data: '+d.time.replace('T',' ');
  await Kadr.ready();
}
update().catch(e => Kadr.fail(e.message));
</script></body></html>
