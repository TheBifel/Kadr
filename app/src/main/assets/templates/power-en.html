<!doctype html>
<html lang="en"><head><meta name="kadr-network" content="none"><meta charset="utf-8"><style>body{font-family:system-ui,sans-serif;padding:18px 20px}#app{min-height:calc(100vh - 36px);display:flex;flex-direction:column}.foot{margin-top:auto;padding-top:12px;padding-right:var(--kadr-controls-width);font-size:9px;line-height:12px}small,.label{font-size:10px;letter-spacing:1px;color:var(--kadr-muted)}h1{font-size:32px;letter-spacing:-1px;margin:12px 0 8px;line-height:1.1}p{font-size:12px;line-height:1.6;margin:0;color:var(--kadr-muted)}b{color:var(--kadr-fg)}.row{display:flex;align-items:center;justify-content:space-between}.badge{background:var(--kadr-accent);color:#344825;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:20px}.bars{display:flex;gap:4px;margin:18px 0 7px}.bars i{height:18px;flex:1;border-radius:3px}.axis{display:flex;justify-content:space-between;font-size:8px;color:var(--kadr-muted)}</style>
<script src="https://kadr.local/vue.global.prod.js"></script></head>
<body><div id="app">
<div class="label">POWER · EXAMPLE</div>
<div class="row"><h1>{{ title }}</h1><span class="badge">↗</span></div>
<p>Demo schedule <b>16:00–18:00</b></p>
<div class="bars"><i v-for="(on,i) in slots" :key="i" :style="{background:on?'var(--kadr-accent)':'#84916d33'}"></i></div>
<div class="axis"><span>00:00</span><span>12:00</span><span>24:00</span></div>
<p class="foot">Demo data</p>
</div><script>
// Design example. Replace the data with a fetch call to your API.
const app = Vue.createApp({
  data: () => ({title:'Power is on',slots:[1,1,1,1,0,0,1,1,1,0,0,1]})
});
app.mount('#app');
Vue.nextTick(() => Kadr.ready());
</script></body></html>
